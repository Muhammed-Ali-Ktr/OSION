<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistem yönetimi · OSION</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#1c64d3">
  <link rel="icon" href="favicon.ico" sizes="48x48">
  <link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="stylesheet" href="admin.css">
</head>
<body>
  <div class="toast-stack" id="toastStack" role="status" aria-live="polite"></div>

  <!-- Açılış / yetki ekranı -->
  <div class="gate" id="gate">
    <div class="gate-card">
      <span class="brand-mark"><img src="icons/logo-mark.png" alt="" width="26" height="26"></span>
      <div class="spinner" id="gateSpinner" aria-hidden="true"></div>
      <h1 id="gateTitle">Yükleniyor…</h1>
      <p id="gateText"></p>
      <div class="gate-actions" id="gateActions"></div>
    </div>
  </div>

  <div class="shell hidden" id="shell">
    <aside class="side" id="side">
      <a class="side-brand" href="/admin">
        <span class="brand-mark"><img src="icons/logo-mark.png" alt="" width="26" height="26"></span>
        <span class="brand-name">OSION</span>
      </a>
      <div class="side-pill">
        <svg viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
        Sistem yönetimi
      </div>
      <nav class="side-nav" aria-label="Yönetim menüsü">
        <a href="#/genel" data-route="genel"><svg viewBox="0 0 24 24"><path d="M3 9.5 12 3l9 6.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Genel bakış</a>
        <div class="side-group">Müşteriler</div>
        <a href="#/isletmeler" data-route="isletmeler"><svg viewBox="0 0 24 24"><path d="M3 21h18"/><path d="M5 21V7l7-4 7 4v14"/><path d="M9 21v-6h6v6"/></svg>İşletmeler</a>
        <a href="#/abonelikler" data-route="abonelikler"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15 14"/></svg>Abonelikler</a>
        <div class="side-group">İletişim</div>
        <a href="#/duyurular" data-route="duyurular"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><polyline points="3 7 12 13 21 7"/></svg>Duyurular</a>
        <div class="side-group">Sistem</div>
        <a href="#/planlar" data-route="planlar"><svg viewBox="0 0 24 24"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg>Planlar ve fiyatlar</a>
        <a href="#/kullanicilar" data-route="kullanicilar"><svg viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>Kullanıcılar</a>
        <a href="#/kayitlar" data-route="kayitlar"><svg viewBox="0 0 24 24"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>İşlem kayıtları</a>
        <a href="#/hesap" data-route="hesap"><svg viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>Giriş bilgilerim</a>
      </nav>
      <div class="side-links">
        <a href="/" target="_blank" rel="noopener">Tanıtım sitesi ↗</a>
        <a href="/panel">İşletme paneli</a>
      </div>
      <div class="side-user">
        <span class="avatar" id="meAvatar"></span>
        <div class="side-user-meta"><strong id="meName"></strong><small id="meEmail"></small></div>
        <button type="button" class="icon-btn" id="logoutBtn" title="Çıkış yap" aria-label="Çıkış yap">
          <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        </button>
      </div>
    </aside>
    <div class="side-overlay" id="sideOverlay"></div>

    <div class="main">
      <header class="mobile-bar">
        <button type="button" class="icon-btn" id="menuBtn" aria-label="Menüyü aç">
          <svg viewBox="0 0 24 24"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
        <span class="mobile-title">Sistem yönetimi</span>
      </header>
      <main class="content" id="content" tabindex="-1"></main>
    </div>
  </div>

  <!-- Yan panel (işletme ayrıntısı) ve iletişim kutusu -->
  <div class="drawer-backdrop hidden" id="drawerBackdrop"></div>
  <aside class="drawer hidden" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawerTitle"></aside>
  <div class="modal-backdrop hidden" id="modal" role="dialog" aria-modal="true"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js" integrity="sha384-GFr3yTh5lJznCbZfpTtXnwboFsxqtTQoeTZCRHhE0579KrRmlCzen5AA8ohaB5ug" crossorigin="anonymous"></script>
  <script src="config.js"></script>
  <script src="admin.js"></script>
</body>
</html>
