<!-- Supabase > Authentication > Emails > Change Email Address
     Konu: OSION e-posta adresi değişikliği -->
<div style="margin:0;padding:24px 12px;background:#f4f5f7;font-family:Arial,Helvetica,sans-serif;color:#1f2933">
  <div style="max-width:520px;margin:0 auto;background:#ffffff;border:1px solid #e1e4e8;border-radius:8px;padding:28px 24px">
    <div style="font-size:20px;font-weight:bold;margin-bottom:16px">OSION</div>
    <h1 style="font-size:17px;margin:0 0 12px">E-posta adresi değişikliği</h1>
    <p style="font-size:14px;line-height:1.6;margin:0 0 20px">Hesabınızın e-posta adresini {{ .Email }} yerine {{ .NewEmail }} olarak değiştirmek için aşağıdaki düğmeye tıklayın.</p>
    <p style="margin:0 0 20px"><a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#1f6feb;color:#ffffff;text-decoration:none;padding:12px 20px;border-radius:6px;font-weight:bold;font-size:14px">Değişikliği Onayla</a></p>
    <p style="font-size:12px;color:#616e7c;line-height:1.6;margin:0">Bu isteği siz yapmadıysanız bu e-postayı yok sayın.</p>
  </div>
</div>
